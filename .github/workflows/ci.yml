name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 手元と同じ版を使う（requirements-dev.txt が唯一の版の出どころ）
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # PMDA配布資材は再配布不可のため未同梱。テスト前に取得する。固定キーで
      # キャッシュしてPMDAへの再ダウンロードを避ける（資材を更新したくなったら
      # キーの v1 を上げる）。
      - uses: actions/cache@v4
        with:
          path: vendor/pmda-styles
          key: pmda-styles-v1
      - run: python src/fetch_vendor.py
      # テストは data/PMDAraw/ を必要としない。本文レンダリングの検証には
      # tests/fixtures/minimal.xml と取得した vendor/pmda-styles/ を使う。
      - run: pytest
